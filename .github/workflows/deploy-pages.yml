name: Deploy to GitHub Pages

# Publishes straight from `main` using the official Pages artifact flow, so
# the repository only ever needs one branch — there is no gh-pages branch to
# keep in sync. In the repo settings, Pages > Source must be "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pixel-office/package-lock.json

      - name: Install dependencies
        working-directory: pixel-office
        run: npm ci

      - name: Build
        working-directory: pixel-office
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pixel-office/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
