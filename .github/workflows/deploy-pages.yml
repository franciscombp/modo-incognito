name: Deploy to GitHub Pages

# Publishes straight from `main` using the official Pages artifact flow —
# builds the repo root in CI and uploads dist/ as the Pages artifact. Nothing
# built is ever committed to git: this requires the repo's Pages source to be
# set to "GitHub Actions" (Settings → Pages → Build and deployment → Source),
# not "Deploy from a branch". With "Deploy from a branch" this workflow still
# runs but Pages would serve the repo root instead of this artifact.

on:
  push:
    branches: [main]
  # El lanzamiento manual acepta elegir DÓNDE correr. Existe por el día en
  # que la nube de runners de GitHub se cayó: todos los jobs `ubuntu-latest`
  # se quedaban en cola y morían a los 15 minutos, incluido el constructor
  # propio de Pages. Con un runner self-hosted conectado (Settings → Actions
  # → Runners), lanzar el workflow con `runner: self-hosted` publica usando
  # TU máquina y se salta la cola compartida entera. Los push normales no se
  # ven afectados: siguen en ubuntu-latest y se recuperan solos.
  workflow_dispatch:
    inputs:
      runner:
        description: "Dónde correr (ubuntu-latest o self-hosted)"
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read
  pages: write
  id-token: write

# UN despliegue a la vez, pero NUNCA cancelando el que está en marcha.
#
# Estuvo en `cancel-in-progress: true` y montó una cascada que dejó el sitio
# cinco commits sin publicar. Lo que pasa es esto: `deploy-pages` no es un
# paso local — RESERVA un despliegue en la infraestructura de Pages y espera
# a que termine. Si se cancela ese job a mitad, la reserva se queda colgada,
# y el siguiente intento se pone a la cola detrás de un despliegue que ya no
# va a acabar nunca: «Current status: deployment_queued» hasta que expira.
# Cada push nuevo cancelaba al anterior y añadía otro zombi a la cola.
#
# Con `false`, un push mientras hay un despliegue en marcha simplemente
# espera su turno (y los intermedios se descartan, que es lo que se quiere:
# publicar el último). Es además lo que recomienda la plantilla oficial de
# Pages, por esta misma razón.
# El NOMBRE del grupo es una válvula de escape, y ya hizo falta una vez.
#
# Un run se quedó encallado en `waiting` durante horas: la API devolvía 502 al
# cancelarlo y «this workflow is already running» al relanzarlo, y el botón de
# la web tampoco podía con él (usa el cancel normal, no `force-cancel`). Un run
# así RETIENE el grupo para siempre, así que ningún push posterior llegaba
# siquiera a compilar — se quedaban todos en `pending` detrás de un fantasma.
#
# Cambiar el nombre del grupo es la única forma de salir sin permisos de
# administrador: los runs nuevos entran en un grupo limpio y el zombi se queda
# solo en el suyo. Si vuelve a pasar, se sube el número y listo.
concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        
        run: npm ci

      - name: Build
        
        # BUILD_ID sella los archivos de `public/` (ver vite.config.js). Con el
        # id de la ejecución, cada publicación pide URLs que ninguna caché ha
        # visto, y además se puede saber de qué deploy salió lo que se sirve.
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
