name: Deploy to GitHub Pages

# Publishes straight from `main` using the official Pages artifact flow —
# builds motor/ in CI and uploads dist/ as the Pages artifact. Nothing
# built is ever committed to git: this requires the repo's Pages source to be
# set to "GitHub Actions" (Settings → Pages → Build and deployment → Source),
# not "Deploy from a branch". With "Deploy from a branch" this workflow still
# runs but Pages would serve the repo root instead of this artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: motor/package-lock.json

      - name: Install dependencies
        working-directory: motor
        run: npm ci

      - name: Build
        working-directory: motor
        # BUILD_ID sella los archivos de `public/` (ver vite.config.js). Con el
        # id de la ejecución, cada publicación pide URLs que ninguna caché ha
        # visto, y además se puede saber de qué deploy salió lo que se sirve.
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: motor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
