name: Deploy to GitHub Pages

# Publishes straight from `main` using the official Pages artifact flow, so
# the repository only ever needs one branch — there is no gh-pages branch.
#
# It ALSO mirrors the build into the repo root and commits it. That copy is
# what gets served if Pages is set to "Deploy from a branch" instead of
# "GitHub Actions": without an index.html at the root, Pages renders README.md
# and the game never shows up. The build uses a relative base, so the same
# files work at either mount point and neither setting can break the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pixel-office/package-lock.json

      - name: Install dependencies
        working-directory: pixel-office
        run: npm ci

      - name: Build
        working-directory: pixel-office
        run: npm run build

      # Keeps the root copy in step with the artifact. `[skip ci]` stops this
      # commit from triggering the workflow again.
      - name: Mirror build to repo root
        if: github.event_name == 'push'
        run: |
          cd pixel-office && npm run sync:root && cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets sprites data index.html favicon.png .nojekyll
          if git diff --cached --quiet; then
            echo "La copia de la raíz ya estaba al día."
          else
            git commit -m "chore: sync built game to repo root [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pixel-office/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
