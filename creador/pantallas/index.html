<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storybook · Modo Incógnito - Design System</title>
  <link rel="icon" href="../../favicon.png" />
  <link rel="stylesheet" href="../../src/style.css">
  <style>
    /* Storybook Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-display);
      background: hsl(var(--bg-000));
      color: hsl(var(--text-000));
    }

    .storybook {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: 100vh;
      gap: 0;
    }

    .sidebar {
      background: hsl(var(--bg-050));
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: var(--space-lg);
    }

    .sidebar h3 {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: hsl(var(--text-faint));
      margin-bottom: var(--space-sm);
      margin-top: var(--space-lg);
    }

    .sidebar h3:first-child {
      margin-top: 0;
    }

    .categories {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cat-btn {
      display: block;
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: hsl(var(--text-200));
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: var(--transition-fast);
      font-weight: 500;
      font-family: inherit;
    }

    .cat-btn:hover {
      background: rgba(0, 0, 0, 0.04);
      color: hsl(var(--text-000));
    }

    .cat-btn.active {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      background: hsl(var(--bg-050));
      border-bottom: 1px solid var(--line);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    .toolbar h2 {
      font-size: 16px;
      margin: 0;
      color: hsl(var(--text-000));
    }

    .toolbar-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .toolbar-actions button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-md);
    }

    .content {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    .components-panel {
      background: hsl(var(--bg-050));
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: var(--space-md);
    }

    .components-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .component-item {
      display: block;
    }

    .comp-btn {
      width: 100%;
      padding: 8px var(--space-md);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: hsl(var(--text-200));
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: inherit;
    }

    .comp-btn:hover {
      background: rgba(0, 0, 0, 0.04);
      color: hsl(var(--text-000));
    }

    .component-item.selected .comp-btn {
      background: rgba(var(--accent-primary-rgb), 0.1);
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      font-weight: 600;
    }

    .preview-panel {
      display: flex;
      flex-direction: column;
      padding: var(--space-lg);
      overflow: auto;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
    }

    .preview-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: hsl(var(--text-faint));
      margin-bottom: var(--space-md);
    }

    .preview-canvas {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 200px;
      padding: var(--space-lg);
      background: hsl(var(--bg-000));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .preview-canvas > * {
      max-width: 100%;
    }

    .styles-panel {
      background: hsl(var(--bg-050));
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .styles-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: hsl(var(--text-faint));
      font-weight: 600;
    }

    .css-editor {
      background: hsl(var(--bg-000));
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: var(--space-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      color: hsl(var(--text-200));
      line-height: 1.4;
      overflow: auto;
      max-height: 150px;
    }

    .css-editor pre {
      margin: 0;
    }

    .css-editor code {
      color: inherit;
    }

    .property-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      font-size: 12px;
    }

    .property {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .property-label {
      font-family: var(--font-mono);
      color: hsl(var(--text-faint));
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-width: 60px;
    }

    .property input,
    .property select {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: hsl(var(--bg-000));
      color: hsl(var(--text-000));
    }

    .info-box {
      background: rgba(var(--accent-primary-rgb), 0.05);
      border: 1px solid rgba(var(--accent-primary-rgb), 0.2);
      border-radius: var(--radius-sm);
      padding: var(--space-sm);
      font-size: 11px;
      color: hsl(var(--text-200));
      line-height: 1.4;
    }

    .info-box b {
      color: hsl(var(--text-000));
    }

    /* Scrollbar custom */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .content {
        grid-template-columns: 250px 1fr;
      }

      .styles-panel {
        display: none;
      }
    }

    @media (max-width: 900px) {
      .storybook {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="storybook">
    <!-- Sidebar con categorías -->
    <div class="sidebar">
      <h3>📚 Componentes</h3>
      <div class="categories"></div>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
      <!-- Toolbar -->
      <div class="toolbar">
        <h2 id="current-category">Tipografía</h2>
        <div class="toolbar-actions">
          <button class="btn secondary" style="font-size: 11px; padding: 6px 12px;" onclick="copyHTML()">📋 HTML</button>
          <button class="btn secondary" style="font-size: 11px; padding: 6px 12px;" onclick="copyCSS()">🎨 CSS</button>
        </div>
      </div>

      <!-- Área de contenido (componentes, preview, estilos) -->
      <div class="content">
        <!-- Lista de componentes -->
        <div class="components-panel">
          <div class="preview-label">Componentes</div>
          <div class="components-list"></div>
        </div>

        <!-- Preview -->
        <div class="preview-panel">
          <div class="preview-label">Vista Previa</div>
          <div class="preview-canvas"></div>
        </div>

        <!-- Panel de estilos -->
        <div class="styles-panel">
          <div class="styles-label">CSS Asociado</div>
          <div class="css-editor"></div>

          <div class="info-box">
            <b>💡 Sistema de Diseño</b><br>
            Los componentes están en <code style="background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 3px; font-size: 10px;">src/style/design-system.css</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./pantallas.js"></script>
</body>
</html>
