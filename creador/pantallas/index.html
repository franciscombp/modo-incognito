<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Incógnito — Storybook & Design System</title>
    <link rel="icon" href="../../favicon.png" />
    <link rel="stylesheet" href="../../src/style/design-system.css">
    <link rel="stylesheet" href="../../src/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: hsl(var(--bg-000));
            margin: 0;
            color: hsl(var(--text-100));
            font-family: var(--font-sans);
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* Sidebar Styling */
        .sb-sidebar {
            width: 280px;
            height: 100vh;
            border-right: 1px solid hsl(var(--border-100));
            padding: var(--space-xl) var(--space-lg);
            position: fixed;
            overflow-y: auto;
            background: hsl(var(--bg-100) / 0.8);
            backdrop-filter: blur(24px);
            z-index: 1001;
        }

        .sb-sidebar-header {
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 10px;
        }

        .sb-sidebar-header span {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.04em;
            color: hsl(var(--text-000));
        }

        .sb-theme-toggle {
            width: 100%;
            font-size: 13px;
            height: 40px;
            justify-content: flex-start;
            gap: 12px;
            margin-bottom: 32px;
        }

        .sb-nav-group {
            margin-bottom: 32px;
        }

        .sb-nav-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: hsl(var(--text-faint));
            margin-bottom: 12px;
            padding-left: 12px;
            font-weight: 700;
        }

        .sb-nav-link {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: hsl(var(--text-100));
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-fast);
        }

        .sb-nav-link:hover {
            background: hsl(var(--bg-200));
            color: hsl(var(--text-000));
            transform: translateX(4px);
        }

        .sb-nav-link.active {
            background: hsl(var(--accent-main));
            color: white;
        }

        /* Content Area */
        .sb-content {
            margin-left: 280px;
            padding: 60px;
            max-width: 1400px;
        }

        .sb-section {
            margin-bottom: 100px;
            scroll-margin-top: 100px;
        }

        .sb-section-title {
            font-size: 32px;
            border-bottom: 2px solid hsl(var(--border-100));
            padding-bottom: 16px;
            margin-bottom: 48px;
            color: hsl(var(--text-000));
            font-family: var(--font-display);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .sb-section-title span {
            font-family: var(--font-mono);
            font-size: 14px;
            opacity: 0.3;
        }

        .sb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        /* Preview Box */
        .sb-box {
            background: hsl(var(--bg-100));
            border: 1px solid hsl(var(--border-100));
            border-radius: 20px;
            padding: 32px;
            position: relative;
            overflow: visible;
        }

        .sb-box.bg-dotted {
            background-image: radial-gradient(hsl(var(--text-000) / 0.12) 1.2px, transparent 0);
            background-size: 24px 24px;
        }

        .sb-label {
            position: absolute;
            top: 16px;
            right: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: hsl(var(--text-faint));
        }

        .sb-comp-head {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: hsl(var(--text-200));
            margin-bottom: 24px;
            display: block;
            letter-spacing: 0.05em;
        }

        .sb-variants-stack {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .type-sample {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: baseline;
            gap: 24px;
            padding: 16px 0;
            border-bottom: 1px solid hsl(var(--border-100) / 0.5);
        }

        .type-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: hsl(var(--text-faint));
        }

        .sb-code-block {
            background: hsl(var(--bg-000));
            border: 1px solid hsl(var(--border-100));
            border-radius: 12px;
            padding: 16px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: hsl(var(--text-200));
            overflow-x: auto;
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .sb-sidebar {
                width: 260px;
            }

            .sb-content {
                margin-left: 260px;
                padding: 40px 32px;
            }

            .sb-section-title {
                font-size: 24px;
                margin-bottom: 32px;
            }

            .sb-box {
                padding: 24px;
            }
        }

        @media (max-width: 800px) {
            .sb-sidebar {
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                width: 100%;
                height: 70px;
                padding: 0 16px;
                border-right: none;
                border-top: 1px solid hsl(var(--border-100));
                background: hsl(var(--bg-100) / 0.9);
                backdrop-filter: blur(24px);
                z-index: 2000;
                display: flex;
                align-items: center;
            }

            .sb-sidebar-header,
            .sb-theme-toggle,
            .sb-sidebar>div:nth-child(3) {
                display: none !important;
            }

            nav {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                align-items: center;
                width: 100%;
                gap: 8px;
                padding-bottom: 4px;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            nav::-webkit-scrollbar {
                display: none;
            }

            .sb-nav-group {
                display: contents;
            }

            .sb-nav-title {
                display: none;
            }

            .sb-nav-link {
                white-space: nowrap;
                padding: 8px 16px;
                background: hsl(var(--bg-200));
                border: 1px solid hsl(var(--border-100));
                border-radius: 20px;
                font-size: 13px;
                margin-bottom: 0;
            }

            .sb-nav-link:hover {
                transform: none;
            }

            .sb-content {
                margin-left: 0;
                padding: 40px 16px 100px;
            }

            .sb-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: hsl(var(--border-100));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: hsl(var(--border-200));
        }
    </style>
</head>

<body>
    <aside class="sb-sidebar">
        <div class="sb-sidebar-header">
            <span>MODO INCÓGNITO</span>
        </div>

        <button class="btn sb-theme-toggle" id="theme-toggle" style="width: 100%; font-size: 13px; height: 40px; justify-content: flex-start; gap: 12px;">
            🌓 <span>Tema</span>
        </button>

        <nav id="sidebar-nav"></nav>
    </aside>

    <main class="sb-content" id="main-content"></main>

    <script type="module" src="./pantallas.js"></script>
</body>

</html>
